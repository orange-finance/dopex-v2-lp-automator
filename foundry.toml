[profile.default]
cache_path = 'cache_forge'
ffi = true
fs_permissions = [{access = "read", path = "./out"}]
libs = ['node_modules', 'lib']
optimizer_runs = 200
out = 'out'
src = 'contracts'
test = 'test'

ast = true
builder = true
extra_output = ["storageLayout"]

[rpc_endpoints]
arb = "${ARB_RPC_URL}"
berachain = "https://rpc.berachain.com"

[invariant]
fail_on_revert = true

[etherscan]
berachain = {key = "${BERASCAN_API_KEY}", url = "https://api.berascan.com/api", chain = 80094}
